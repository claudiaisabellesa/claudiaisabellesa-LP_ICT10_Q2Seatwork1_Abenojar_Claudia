
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>ICT Q2 Seatwork 1 Demon Slayer Checker</title>

    <style>
        :root {
            --background: #f8eeee;
            --card: #fffafa;
            --rose: #e8b9c1;
            --dusty-rose: #d99ba8;
            --crimson: #a94b60;
            --burgundy: #753746;
            --pale-pink: #f5dce1;
            --ivory: #fff7f1;
            --charcoal: #35272b;
            --muted: #826d72;
            --border: #e6c5cc;
            --shadow: rgba(117, 55, 70, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--charcoal);

            background:
                radial-gradient(
                    circle at top left,
                    #f2d6dc 0%,
                    transparent 42%
                ),
                linear-gradient(
                    145deg,
                    #f9eeee,
                    #f1dfe2,
                    #f8f2ed
                );
        }

        .container {
            width: 100%;
            max-width: 580px;
            padding: 36px;

            text-align: center;
            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow:
                0 12px 35px var(--shadow),
                0 3px 10px rgba(117, 55, 70, 0.04);
        }

        .accent-line {
            width: 55px;
            height: 5px;
            margin: 0 auto 22px;

            background: var(--crimson);
            border-radius: 20px;
        }

        .eyebrow {
            margin: 0 0 10px;

            color: var(--crimson);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            padding: 20px 16px;

            color: var(--burgundy);
            background: linear-gradient(
                135deg,
                #f3d9df,
                #e8bdc7
            );

            border: 1px solid #e4b9c3;
            border-radius: 12px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(21px, 4vw, 27px);
            font-weight: bold;
            line-height: 1.4;
        }

        h2 {
            margin: 18px 0 28px;

            color: var(--crimson);
            font-size: 17px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: var(--burgundy);
            font-size: 15px;
            font-weight: bold;
        }

        input[type="text"] {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;

            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;

            background: #fffdfd;
            color: var(--charcoal);

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;

            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder {
            color: #a18b90;
        }

        input[type="text"]:focus {
            border-color: var(--crimson);
            box-shadow: 0 0 0 3px rgba(217, 155, 168, 0.2);
        }

        input[type="button"] {
            width: 100%;
            min-height: 46px;
            margin-top: 5px;
            padding: 12px 20px;

            border: 1px solid var(--crimson);
            border-radius: 9px;
            cursor: pointer;

            background: var(--crimson);
            color: white;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: bold;

            transition: background 0.2s, transform 0.2s;
        }

        input[type="button"]:hover {
            background: var(--burgundy);
            transform: translateY(-1px);
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        input[type="button"]:focus-visible {
            outline: 3px solid var(--rose);
            outline-offset: 3px;
        }

        #result {
            min-height: 24px;
            margin-top: 20px;
            padding: 12px;

            border-radius: 9px;
            background: #fbf0f2;
            color: var(--burgundy);

            font-size: 16px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        footer {
            margin-top: 25px;
            padding-top: 18px;

            border-top: 1px solid #edd9dd;

            color: var(--muted);
            font-size: 13px;
            line-height: 1.9;
        }

        footer span {
            color: var(--crimson);
            font-weight: bold;
        }

        .footer-accent {
            width: 35px;
            height: 3px;
            margin: 20px auto 0;

            background: var(--rose);
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }

            .container {
                padding: 25px 19px;
                border-radius: 14px;
            }

            h1 {
                padding: 17px 12px;
            }

            h2 {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <div class="accent-line"></div>

            <p class="eyebrow">Candidate Registration</p>

            <h1>Demon Slayer: KNY character Checker</h1>

            <h2>Candidate Verification System</h2>
        </header>

        <main>
            <form id="candidate-form" onsubmit="return false;">

                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        placeholder="Enter your first name"
                        autocomplete="given-name"
                    >
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        placeholder="Enter your last name"
                        autocomplete="family-name"
                    >
                </div>

                <input
                    type="button"
                    py-click="candidate_checker"
                    value="Verify Candidate"
                >
            </form>

            <div
                id="result"
                role="status"
                aria-live="polite"
            ></div>
        </main>

        <footer>
            &copy; 2026 <span>OUUUU DEMON SLAYER</span>
            <br>
            Seatwork #1 &bull; Second Quarter
            <div class="footer-accent"></div>
        </footer>

    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
